<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 窗口状态</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main class="shell"><section class="panel" aria-label="Codex 窗口状态">
<div class="toolbar"><nav class="tabs" aria-label="筛选状态"><button class="tab active" data-filter="all">全部 <span id="count-all">0</span></button><button class="tab" data-filter="idle">空闲 <span id="count-idle">0</span></button><button class="tab" data-filter="busy">执行中 <span id="count-busy">0</span></button><button class="tab" data-filter="other">其他 <span id="count-other">0</span></button></nav><div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索项目或路径" aria-label="搜索项目或路径"></label><label class="sort"><input type="checkbox" id="idle-first" checked>空闲优先</label></div></div>
<div id="notice" class="notice" role="status">正在连接本机监控服务…</div>
<div id="window-message" class="window-message" role="status" aria-live="polite" hidden></div>
<div class="table-scroll"><table><thead><tr><th>窗口 / 项目</th><th>Codex 状态</th><th>当前状态持续</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer><span id="showing">尚未发现窗口</span><span id="connection">连接中</span></footer>
</section></main>
<dialog id="detail"><div class="modal-head"><h2 id="detail-title">窗口详情</h2><button id="close-detail" aria-label="关闭详情">×</button></div><dl id="detail-fields"></dl><section class="session-section" aria-label="窗口内的会话"><h3>窗口内的会话</h3><div id="detail-sessions"></div></section><p class="hint">同一个客户端的多个会话汇总为一行；会话执行状态分别保留。</p></dialog>
<dialog id="window-picker" aria-labelledby="window-picker-title"><div class="modal-head"><h2 id="window-picker-title">选择 VS Code 窗口</h2><button id="close-window-picker" aria-label="取消窗口选择">×</button></div><p id="window-picker-reason" class="picker-reason"></p><div id="window-choices" class="window-choices"></div><p class="hint">选择后，本次监控运行期间会记住对应关系。</p></dialog>
<dialog id="block-dialog" aria-labelledby="block-title"><form id="block-form"><div class="modal-head"><h2 id="block-title">标记窗口阻塞</h2><button type="button" id="close-block" aria-label="取消标记阻塞">×</button></div><p id="block-project" class="picker-reason"></p><label for="block-reason" class="block-label">阻塞原因（可选）</label><textarea id="block-reason" rows="4" maxlength="500" placeholder="例如：等待资料，或暂时不处理这个项目"></textarea><p class="block-help">最多 500 字。窗口将排到列表末尾，Codex 的实际状态仍照常显示。</p><p id="block-error" class="block-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="cancel-block" class="detail-button">取消</button><button type="submit" id="save-block" class="detail-button go-button">标记阻塞</button></div></form></dialog>
</body></html>
